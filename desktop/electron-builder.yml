  - '!data{,/**/*}'
  - '!workspace{,/**/*}'
  - '!tests{,/**/*}'
  - '!node_modules{,/**/*}'
win:
  icon: desktop/icon.ico
  executableName: BLACKICE
  target:
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: true
  # Request the highest available rights. The manifest-only Windows diagnostic
  # kept the administrator parent elevated and allowed restricted Chromium children.
  requestedExecutionLevel: highestAvailable
artifactName: Blackice-${version}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BLACKICE
  uninstallDisplayName: BLACKICE ${version}
  deleteAppDataOnUninstall: false
  runAfterFinish: false
electronLanguages:
  - en-US
