appId: com.agentdesk.workbench
productName: BLACKICE
copyright: Copyright 2026 BLACKICE
asar: false
npmRebuild: false
directories:
  output: .build/desktop
  buildResources: desktop
files:
  - package.json
  - LICENSE
  - NOTICE
  - THIRD-PARTY-NOTICES.md
  - server.mjs
  - public/**/*
  - lib/**/*
  - scripts/generate-noir-background.mjs
  - scripts/noir-scene.config.json
  - scripts/chatgpt-bridge.mjs
  - scripts/email-oauth-token.mjs
  - scripts/remote-access-cli.mjs
  - scripts/browser-cli.mjs
  - scripts/chatgpt-cli.mjs
  - scripts/repair-shortcuts.ps1
  - BROWSER-IMPORT.md
  - CHATGPT-BRIDGE.md
  - CHATGPT-CONNECTOR.md
  - desktop/**/*.mjs
  - desktop/**/*.cjs
  - desktop/**/*.cs
  - desktop/**/*.ps1
  - desktop/browser-compatibility/**/*
  - '!desktop/build-icon.mjs'
  - CHAT-MODE.md
  - RELEASE-NOTES-2.31.0.md
  - RELEASE-NOTES-2.31.1.md
  - RELEASE-NOTES-2.32.0.md
  - RELEASE-NOTES-2.33.5.md
  - RELEASE-NOTES-2.33.6.md
  - RELEASE-NOTES-2.33.8.md
  - RELEASE-NOTES-2.33.9.md
  - RELEASE-NOTES-2.33.10.md
  - RELEASE-NOTES-2.33.11.md
  - RELEASE-NOTES-2.33.12.md
  - RELEASE-NOTES-2.33.13.md
  - RELEASE-NOTES-2.34.0.md
  - RELEASE-NOTES-2.34.1.md
  - RELEASE-NOTES-2.34.2.md
  - RELEASE-NOTES-2.34.3.md
  - RELEASE-NOTES-2.34.4.md
  - RELEASE-NOTES-2.35.0.md
  - RELEASE-NOTES-2.35.1.md
  - RELEASE-NOTES-2.35.2.md
  - RELEASE-NOTES-2.35.3.md
  - RELEASE-NOTES-2.35.4.md
  - RELEASE-NOTES-2.35.5.md
  - RELEASE-NOTES-2.35.6.md
  - RELEASE-NOTES-2.36.0.md
  - RELEASE-NOTES-2.36.1.md
  - RELEASE-NOTES-2.37.0.md
  - RELEASE-NOTES-2.38.0.md
  - PLANNING-ORGANIZATION.md
  - REMOTE-ACCESS.md
  - BROWSER-PROTECTION.md
  - EMAIL.md
  - PLANNING-AWARENESS.md
  - RELEASE-NOTES-2.30.0.md
  - desktop/icon.ico
  - '!**/*.test.mjs'
  - '!**/*.currents-backup-*'
  - '!**/*.ownership-backup'
  - '!**/*.ownership-backup/**/*'
  - '!data{,/**/*}'
  - '!workspace{,/**/*}'
  - '!tests{,/**/*}'
  - '!node_modules{,/**/*}'
win:
  icon: desktop/icon.ico
  executableName: BLACKICE
  target:
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: true
  requestedExecutionLevel: asInvoker
artifactName: Blackice-${version}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BLACKICE
  uninstallDisplayName: BLACKICE ${version}
  deleteAppDataOnUninstall: false
  runAfterFinish: false
electronLanguages:
  - en-US
