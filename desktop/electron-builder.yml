appId: com.agentdesk.workbench
productName: BLACKICE
copyright: Copyright 2026 BLACKICE
asar: false
npmRebuild: false
extraResources:
  - from: .build/llama.cpp
    to: llama.cpp
    filter:
      - "**/*"
toolsets:
  nsis: "1.2.1"
directories:
  output: .build/desktop
  buildResources: desktop
files:
  - package.json
  - LICENSE
  - NOTICE
  - THIRD-PARTY-NOTICES.md
  - server.mjs
  - public/**/*
  - lib/**/*
  - scripts/generate-noir-background.mjs
  - scripts/noir-scene.config.json
  - scripts/chatgpt-bridge.mjs
  - scripts/email-oauth-token.mjs
  - scripts/remote-access-cli.mjs
  - scripts/browser-cli.mjs
  - scripts/chatgpt-cli.mjs
  - scripts/repair-shortcuts.ps1
  - CHATGPT-CONNECTOR.md
  - RELEASE-NOTES.md
  - desktop/**/*.mjs
  - desktop/**/*.cjs
  - desktop/**/*.cs
  - desktop/**/*.ps1
  - desktop/browser-compatibility/**/*
  - desktop/password-manager/**/*
  - '!desktop/build-icon.mjs'
  - docs/instruction-audit.md
  - docs/GOAL-MODE.md
  - REMOTE-ACCESS.md
  - desktop/icon.ico
  - '!desktop/upgrade-preflight.ps1'
  - '!**/*.test.mjs'
  - '!**/*.currents-backup-*'
  - '!**/*.ownership-backup'
  - '!**/*.ownership-backup/**/*'
  - '!data{,/**/*}'
  - '!workspace{,/**/*}'
  - '!tests{,/**/*}'
  - '!node_modules{,/**/*}'
win:
  icon: desktop/icon.ico
  executableName: BLACKICE
  target:
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: true
  # Request the highest available rights. The manifest-only Windows diagnostic
  # kept the administrator parent elevated and allowed restricted Chromium children.
  requestedExecutionLevel: highestAvailable
artifactName: Blackice-${version}-Setup.${ext}
nsis:
  include: desktop/installer.nsh
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BLACKICE
  uninstallDisplayName: BLACKICE ${version}
  deleteAppDataOnUninstall: false
  runAfterFinish: true
electronLanguages:
  - en-US
