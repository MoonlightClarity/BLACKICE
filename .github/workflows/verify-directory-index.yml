name: Verify isolated Directory index prototype
on:
  push:
    branches: [codex/directory-index-verify]
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 761f7c8165de12049b51cf031dd73cab00bd226a
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.2'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Verify bundled Electron SQLite capability without launching the app
        shell: pwsh
        run: |
          @'
          const {spawnSync}=require('node:child_process');
          const executable=require('electron');
          const code="const {DatabaseSync}=require('node:sqlite');const db=new DatabaseSync(':memory:');console.log(JSON.stringify({kind:'electron-sqlite-capability',electron:process.versions.electron,node:process.versions.node,sqlite:db.prepare('select sqlite_version() as version').get().version,modelAdmissions:0}));db.close();";
          const result=spawnSync(executable,['-e',code],{env:{...process.env,ELECTRON_RUN_AS_NODE:'1'},encoding:'utf8',windowsHide:true});
          process.stdout.write(result.stdout||'');process.stderr.write(result.stderr||'');
          if(result.error)throw result.error;
          process.exitCode=result.status===0?0:1;
          '@ | node
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Electron SQLite capability failed.' }
      - run: node scripts/source-suite-receipt.mjs source-suite-evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: directory-index-integrity-source-evidence
          path: source-suite-evidence
          if-no-files-found: warn
