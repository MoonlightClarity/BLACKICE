name: Read isolated draft runtime evidence
on:
  push:
    branches: [codex/verify-239-runner-tar]
    paths: [.github/workflows/verify-239-runner-tar.yml]
permissions:
  contents: write
jobs:
  read-draft-evidence:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Read exact failed installer evidence without changing the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$false
          $repo='MoonlightClarity/BLACKICE'
          $target='5f578fcb70214cf6cac787707ea43d3906d4fd0a'
          $releaseId=431574215
          $expected=@(
            @{name='blackice-runtime-validation.json';id=702065914;bytes=1507;sha256='8fe9f776408d54476c74cce459388f04a87fa8e23c792d468dc3d248758aa35b'},
            @{name='blackice-windows-install-validation.json';id=702065909;bytes=3318;sha256='7b674f10078bf4d6fb607d34e0d30518af0f472fce281405ef4f0fef8975dc7c'},
            @{name='blackice-native-workbench-integrity.json';id=702065945;bytes=485;sha256='5680eccd427d636593ac554c6142494b9128522e119c43cae45709316d45af8d'},
            @{name='blackice-source-test-provenance.json';id=702065913;bytes=872;sha256='d637743f54a3d7263d644936731e287efac577ad29a3a0b540eac82c9886268f'}
          )
          function Read-ExactRelease {
            $raw=gh api "repos/$repo/releases/$releaseId"
            if ($LASTEXITCODE -ne 0) { throw 'Draft metadata read failed.' }
            $release=$raw | ConvertFrom-Json
            if ($release.id -ne $releaseId -or $release.draft -ne $true -or $release.tag_name -cne 'v2.39.0' -or $release.target_commitish -cne $target) { throw 'Draft identity changed.' }
            foreach ($row in $expected) {
              $matches=@($release.assets | Where-Object name -CEQ $row.name)
              if ($matches.Count -ne 1 -or $matches[0].id -ne $row.id -or $matches[0].state -cne 'uploaded' -or $matches[0].size -ne $row.bytes -or $matches[0].digest -cne ('sha256:'+$row.sha256)) { throw 'Exact diagnostic asset identity changed.' }
            }
            return $release
          }
          $null=Read-ExactRelease
          $root=[IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          $name='blackice-draft-read-'+[guid]::NewGuid().ToString('N')
          $owned=[IO.Path]::GetFullPath((Join-Path $root $name))
          if ([IO.Path]::GetDirectoryName($owned) -ine $root -or [IO.Path]::GetFileName($owned) -cne $name) { throw 'Diagnostic folder boundary mismatch.' }
          [IO.Directory]::CreateDirectory($owned) | Out-Null
          try {
            foreach ($row in $expected) {
              gh release download v2.39.0 --repo $repo --dir $owned --pattern $row.name
              if ($LASTEXITCODE -ne 0) { throw 'Draft JSON download failed.' }
              $file=Join-Path $owned $row.name
              $item=Get-Item -LiteralPath $file
              if ($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $item.Length -gt 1000000 -or $item.Length -ne $row.bytes) { throw 'Diagnostic JSON file is not bounded and exact.' }
              $hash=(Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($hash -cne $row.sha256) { throw 'Diagnostic asset bytes differ.' }
              $value=[IO.File]::ReadAllText($file) | ConvertFrom-Json
              @{event='draftEvidence';name=$row.name;assetId=$row.id;bytes=$item.Length;sha256=$hash;value=$value} | ConvertTo-Json -Compress -Depth 40
            }
            $null=Read-ExactRelease
            @{event='draftEvidenceReadCompleted';releaseId=$releaseId;draft=$true;tag='v2.39.0';target=$target;files=$expected.Count;releaseEdits=$false;vmActions=$false} | ConvertTo-Json -Compress
          } finally {
            if ([IO.Path]::GetDirectoryName($owned) -ine $root -or [IO.Path]::GetFileName($owned) -cne $name) { throw 'Diagnostic cleanup boundary mismatch.' }
            Remove-Item -LiteralPath $owned -Recurse -Force
          }
