name: Compare exact draft executable execution manifests
on:
  push:
    branches: [codex/verify-239-runner-tar]
    paths: [.github/workflows/verify-239-runner-tar.yml]
permissions:
  contents: write
jobs:
  exact-startup:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 5f578fcb70214cf6cac787707ea43d3906d4fd0a
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - name: Read only the exact draft Setup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $raw=gh api repos/MoonlightClarity/BLACKICE/releases/431574215
          if ($LASTEXITCODE -ne 0) { throw 'Draft read failed.' }
          $release=$raw | ConvertFrom-Json
          if ($release.id -ne 431574215 -or $release.draft -ne $true -or $release.tag_name -cne 'v2.39.0' -or $release.target_commitish -cne '5f578fcb70214cf6cac787707ea43d3906d4fd0a') { throw 'Draft identity changed.' }
          $assets=@($release.assets | Where-Object name -CEQ 'Blackice-2.39.0-Setup.exe')
          if ($assets.Count -ne 1 -or $assets[0].id -ne 702063316 -or $assets[0].size -ne 154423063 -or $assets[0].digest -cne 'sha256:c16a3f3d47be4c1f2b25f4100d42d8518d999ceeb3b2e1888bd615f553b74d6f') { throw 'Exact draft Setup changed.' }
          $root=Join-Path $env:RUNNER_TEMP ('blackice-startup-diag-'+[guid]::NewGuid().ToString('N'))
          [IO.Directory]::CreateDirectory($root) | Out-Null
          "BLACKICE_STARTUP_DIAG=$root" >> $env:GITHUB_ENV
          gh release download v2.39.0 --repo MoonlightClarity/BLACKICE --dir $root --pattern Blackice-2.39.0-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'Exact Setup download failed.' }
          $setup=Join-Path $root 'Blackice-2.39.0-Setup.exe'
          if ((Get-Item -LiteralPath $setup).Length -ne 154423063 -or (Get-FileHash -LiteralPath $setup).Hash.ToLowerInvariant() -cne 'c16a3f3d47be4c1f2b25f4100d42d8518d999ceeb3b2e1888bd615f553b74d6f') { throw 'Exact Setup checksum failed.' }
      - name: Run original hidden offline verifier and print only redacted failure diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item Env:GH_TOKEN,Env:NODE_OPTIONS,Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $root=[IO.Path]::GetFullPath($env:BLACKICE_STARTUP_DIAG)
          $runner=[IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          if ([IO.Path]::GetDirectoryName($root) -ine $runner -or [IO.Path]::GetFileName($root) -notmatch '^blackice-startup-diag-[a-f0-9]{32}$') { throw 'Owned diagnostic path mismatch.' }
          $source=Join-Path $env:GITHUB_WORKSPACE 'source'
          if ((& git -C $source rev-parse HEAD).Trim() -cne '5f578fcb70214cf6cac787707ea43d3906d4fd0a') { throw 'Checkout is not the exact frozen source.' }
          $install=Join-Path $root 'install'
          $runtime=Join-Path $root 'runtime'
          [IO.Directory]::CreateDirectory($runtime) | Out-Null
          $report=Join-Path $root 'runtime-report.json'
          $exe=Join-Path $install 'BLACKICE.exe'
          $node=(Get-Command node.exe -CommandType Application | Select-Object -First 1).Source
          $setup=Join-Path $root 'Blackice-2.39.0-Setup.exe'
          $installed=$false;$forced=$false;$runtimeExit=$null
          function Wait-OwnedSetup([string]$File,[string]$Arguments) {
            $job=Start-Job -ArgumentList $File,$Arguments -ScriptBlock {
              param($File,$Arguments)
              $p=Start-Process -FilePath $File -ArgumentList $Arguments -Wait -PassThru -WindowStyle Hidden
              [int]$p.ExitCode
            }
            try {
              $done=Wait-Job $job -Timeout 180
              if (!$done -or $job.State -ne 'Completed') { throw 'Owned setup process tree exceeded its bound.' }
              $codes=@(Receive-Job $job -ErrorAction Stop)
              if ($codes.Count -ne 1 -or $codes[0] -ne 0) { throw 'Owned setup returned nonzero exit.' }
            } finally {
              if ($job.State -eq 'Running') { Stop-Job $job }
              Remove-Job $job -Force
            }
          }
          function Redact-Excerpt([string]$Text) {
            foreach ($prefix in @($root,$source,$env:RUNNER_TEMP,$env:USERPROFILE,$env:APPDATA)) {
              if ($prefix) {
                $Text=[regex]::Replace($Text,[regex]::Escape($prefix),'<owned>','IgnoreCase')
                $Text=[regex]::Replace($Text,[regex]::Escape($prefix.Replace('\','/')),'<owned>','IgnoreCase')
              }
            }
            $Text=[regex]::Replace($Text,'(?i)https?://(?:127\.0\.0\.1|localhost|\[::1\])(?::\d+)?[^\s"''<>]*','<loopback>')
            $Text=[regex]::Replace($Text,'(?i)Bearer\s+[A-Za-z0-9._~+/-]+=*','Bearer <redacted>')
            $Text=[regex]::Replace($Text,'(?i)((?:cookie|set-cookie|token|password|api[-_]?key|authorization)\s*["'']?\s*[:=]\s*)(?:"[^"]*"|''[^'']*''|[^\s,;]+)','$1<redacted>')
            return $Text
          }
          try {
            Wait-OwnedSetup $setup "/S /currentuser /D=$install"
            $installed=$true
            $fingerprint=@'
          import {pathToFileURL} from 'node:url';
          const [source,app]=process.argv.slice(1);
          const {appFingerprint}=await import(pathToFileURL(source+'/scripts/release-check.mjs'));
          const expected='0ae9f24468d3ce0a756836e54fe5c1ffd44c69f56d747ae0c8f65a4010fb5a22';
          if(await appFingerprint(source)!==expected||await appFingerprint(app)!==expected)throw Error('Installed source fingerprint differs.');
          console.log(JSON.stringify({event:'exactInstalledFingerprint',passed:true,appFingerprint:expected}));
          '@
            & $node --input-type=module -e $fingerprint $source (Join-Path $install 'resources/app')
            if ($LASTEXITCODE -ne 0) { throw 'Installed app fingerprint failed.' }
            $manifestSource=@'
          using System;
          using System.Collections.Generic;
          using System.Collections.Concurrent;
          using System.Diagnostics;
          using System.Runtime.InteropServices;
          using System.Text;
          using System.Text.RegularExpressions;
          using System.Threading;
          public static class DiagnosticManifestProbe {
           delegate bool LanguageCallback(IntPtr module,IntPtr type,IntPtr name,ushort language,IntPtr parameter);
           [DllImport("kernel32.dll",CharSet=CharSet.Unicode,SetLastError=true)] static extern IntPtr LoadLibraryExW(string file,IntPtr reserved,uint flags);
           [DllImport("kernel32.dll",CharSet=CharSet.Unicode,SetLastError=true)] static extern bool EnumResourceLanguagesW(IntPtr module,IntPtr type,IntPtr name,LanguageCallback callback,IntPtr parameter);
           [DllImport("kernel32.dll",CharSet=CharSet.Unicode,SetLastError=true)] static extern IntPtr FindResourceExW(IntPtr module,IntPtr type,IntPtr name,ushort language);
           [DllImport("kernel32.dll",SetLastError=true)] static extern uint SizeofResource(IntPtr module,IntPtr resource);
           [DllImport("kernel32.dll",SetLastError=true)] static extern IntPtr LoadResource(IntPtr module,IntPtr resource);
           [DllImport("kernel32.dll")] static extern IntPtr LockResource(IntPtr resource);
           [DllImport("kernel32.dll")] static extern bool FreeLibrary(IntPtr module);
           [DllImport("kernel32.dll",CharSet=CharSet.Unicode,SetLastError=true)] static extern IntPtr BeginUpdateResourceW(string file,bool deleteExisting);
           [DllImport("kernel32.dll",CharSet=CharSet.Unicode,SetLastError=true)] static extern bool UpdateResourceW(IntPtr update,IntPtr type,IntPtr name,ushort language,byte[] data,uint length);
           [DllImport("kernel32.dll",SetLastError=true)] static extern bool EndUpdateResourceW(IntPtr update,bool discard);
           [DllImport("kernel32.dll",SetLastError=true)] static extern IntPtr OpenProcess(uint access,bool inherit,int pid);
           [DllImport("kernel32.dll",CharSet=CharSet.Unicode,SetLastError=true)] static extern bool QueryFullProcessImageNameW(IntPtr process,uint flags,StringBuilder name,ref uint length);
           [DllImport("advapi32.dll",SetLastError=true)] static extern bool OpenProcessToken(IntPtr process,uint access,out IntPtr token);
           [DllImport("advapi32.dll",SetLastError=true)] static extern bool GetTokenInformation(IntPtr token,uint kind,out int elevation,uint length,out uint returned);
           [DllImport("kernel32.dll")] static extern bool CloseHandle(IntPtr handle);
           public sealed class Manifest { public ushort Language;public string Level;public string Sha256;public byte[] Data;public string Xml;public Encoding Encoding;public byte[] Preamble; }
           public sealed class Elevation { public int Pid;public bool Elevated; }
           static readonly Regex Level=new Regex(@"(<(?:[\w.-]+:)?requestedExecutionLevel\b[^>]*\blevel\s*=\s*)([""'])([^""']+)\2",RegexOptions.IgnoreCase);
           static Exception Error(){return new System.ComponentModel.Win32Exception(Marshal.GetLastWin32Error());}
           static string Hash(byte[] data){using(var sha=System.Security.Cryptography.SHA256.Create())return BitConverter.ToString(sha.ComputeHash(data)).Replace("-","").ToLowerInvariant();}
           public static Manifest Read(string file){
            IntPtr module=LoadLibraryExW(file,IntPtr.Zero,0x22);if(module==IntPtr.Zero)throw Error();
            try{
             var languages=new List<ushort>();LanguageCallback callback=delegate(IntPtr m,IntPtr t,IntPtr n,ushort language,IntPtr p){languages.Add(language);return languages.Count<16;};
             if(!EnumResourceLanguagesW(module,new IntPtr(24),new IntPtr(1),callback,IntPtr.Zero))throw Error();
             if(languages.Count!=1)throw new InvalidOperationException("Expected exactly one actual manifest language.");
             IntPtr resource=FindResourceExW(module,new IntPtr(24),new IntPtr(1),languages[0]);if(resource==IntPtr.Zero)throw Error();
             uint size=SizeofResource(module,resource);if(size<20||size>1048576)throw new InvalidOperationException("Manifest resource size is unsafe.");
             IntPtr loaded=LoadResource(module,resource);if(loaded==IntPtr.Zero)throw Error();IntPtr data=LockResource(loaded);if(data==IntPtr.Zero)throw Error();
             byte[] bytes=new byte[(int)size];Marshal.Copy(data,bytes,0,bytes.Length);Encoding encoding=new UTF8Encoding(false,true);int skip=0;
             if(bytes[0]==0xef&&bytes[1]==0xbb&&bytes[2]==0xbf)skip=3;
             else if(bytes[0]==0xff&&bytes[1]==0xfe){encoding=new UnicodeEncoding(false,false,true);skip=2;}
             else if(bytes[0]==0xfe&&bytes[1]==0xff){encoding=new UnicodeEncoding(true,false,true);skip=2;}
             else if(bytes[0]==0x3c&&bytes[1]==0){encoding=new UnicodeEncoding(false,false,true);}
             else if(bytes[0]==0&&bytes[1]==0x3c){encoding=new UnicodeEncoding(true,false,true);}
             string xml=encoding.GetString(bytes,skip,bytes.Length-skip);var matches=Level.Matches(xml);if(matches.Count!=1)throw new InvalidOperationException("Expected one requested execution level.");
             byte[] preamble=new byte[skip];Buffer.BlockCopy(bytes,0,preamble,0,skip);
             return new Manifest{Language=languages[0],Level=matches[0].Groups[3].Value,Sha256=Hash(bytes),Data=bytes,Xml=xml,Encoding=encoding,Preamble=preamble};
            }finally{FreeLibrary(module);}
           }
           public static Manifest ChangeLevel(string file,string level){
            if(level!="asInvoker"&&level!="highestAvailable")throw new ArgumentException("Only the two diagnostic levels are allowed.");
            Manifest before=Read(file);if(before.Level!="requireAdministrator")throw new InvalidOperationException("Original manifest is not the exact expected level.");
            string xml=Level.Replace(before.Xml,m=>m.Groups[1].Value+m.Groups[2].Value+level+m.Groups[2].Value,1);
            byte[] text=before.Encoding.GetBytes(xml),bytes=new byte[before.Preamble.Length+text.Length];Buffer.BlockCopy(before.Preamble,0,bytes,0,before.Preamble.Length);Buffer.BlockCopy(text,0,bytes,before.Preamble.Length,text.Length);
            IntPtr update=BeginUpdateResourceW(file,false);if(update==IntPtr.Zero)throw Error();
            try{
             if(!UpdateResourceW(update,new IntPtr(24),new IntPtr(1),before.Language,bytes,(uint)bytes.Length))throw Error();
             bool committed=EndUpdateResourceW(update,false);update=IntPtr.Zero;if(!committed)throw Error();
            }finally{if(update!=IntPtr.Zero)EndUpdateResourceW(update,true);}
            Manifest after=Read(file);if(after.Language!=before.Language||after.Level!=level||after.Sha256!=Hash(bytes))throw new InvalidOperationException("Actual manifest readback did not match.");return after;
           }
           static volatile bool stop;static Thread watcher;static ConcurrentDictionary<int,bool> elevations=new ConcurrentDictionary<int,bool>();
           public static void StartWatch(string executable){
            if(watcher!=null)throw new InvalidOperationException("A diagnostic watcher already exists.");stop=false;elevations.Clear();
            watcher=new Thread(delegate(){while(!stop){foreach(Process process in Process.GetProcessesByName("BLACKICE")){IntPtr handle=IntPtr.Zero,token=IntPtr.Zero;try{
              handle=OpenProcess(0x1000,false,process.Id);if(handle==IntPtr.Zero)continue;var name=new StringBuilder(32768);uint length=(uint)name.Capacity;
              if(!QueryFullProcessImageNameW(handle,0,name,ref length)||!String.Equals(name.ToString(),executable,StringComparison.OrdinalIgnoreCase))continue;
              if(!OpenProcessToken(handle,8,out token))continue;int elevated;uint returned;if(GetTokenInformation(token,20,out elevated,4,out returned))elevations[process.Id]=elevated!=0;
             }catch{}finally{if(token!=IntPtr.Zero)CloseHandle(token);if(handle!=IntPtr.Zero)CloseHandle(handle);process.Dispose();}}Thread.Sleep(50);}});watcher.IsBackground=true;watcher.Start();
           }
           public static Elevation[] StopWatch(){stop=true;if(watcher!=null){if(!watcher.Join(2000))throw new InvalidOperationException("Diagnostic observer did not stop.");watcher=null;}var result=new List<Elevation>();foreach(var pair in elevations)result.Add(new Elevation{Pid=pair.Key,Elevated=pair.Value});return result.ToArray();}
          }
          '@
            Add-Type -TypeDefinition $manifestSource
            $original=Join-Path $root 'original-BLACKICE.exe'
            [IO.File]::Copy($exe,$original,$false)
            $originalHash=(Get-FileHash -LiteralPath $original).Hash.ToLowerInvariant()
            if($originalHash -cne 'b6ec3418ce49dba58fbf0e42c6a524591c9c8ff4f5e5d59fbc6a3ec4aca0f0e8'){throw 'Original installed executable differs.'}
            $signature=Get-AuthenticodeSignature -LiteralPath $exe
            if($signature.Status -ne 'NotSigned'){throw 'Only the exact unsigned diagnostic executable may be edited.'}
            $originalManifest=[DiagnosticManifestProbe]::Read($exe)
            if($originalManifest.Level -cne 'requireAdministrator'){throw 'Actual execution manifest is not requireAdministrator.'}
            @{event='originalExecutionManifest';diagnosticOnly=$true;resourceType=24;resourceId=1;language=$originalManifest.Language;level=$originalManifest.Level;manifestSha256=$originalManifest.Sha256;exeSha256=$originalHash;signature=[string]$signature.Status} | ConvertTo-Json -Compress
            foreach($mode in @('requireAdministrator','asInvoker','highestAvailable')){
            $prefix=[IO.Path]::GetFullPath($install).TrimEnd('\')+'\'
            if(@(Get-CimInstance Win32_Process | Where-Object {$_.ExecutablePath -and $_.ExecutablePath.StartsWith($prefix,[StringComparison]::OrdinalIgnoreCase)}).Count -ne 0){throw 'Previous diagnostic native process is still active.'}
            [IO.File]::Copy($original,$exe,$true)
            if($mode -ne 'requireAdministrator'){$null=[DiagnosticManifestProbe]::ChangeLevel($exe,$mode)}
            $actualManifest=[DiagnosticManifestProbe]::Read($exe)
            if($actualManifest.Level -cne $mode -or $actualManifest.Language -ne $originalManifest.Language){throw 'Diagnostic manifest identity differs.'}
            @{event='diagnosticExecutionManifest';mode=$mode;diagnosticOnly=$true;installerAcceptance=$false;resourceType=24;resourceId=1;language=$actualManifest.Language;level=$actualManifest.Level;manifestSha256=$actualManifest.Sha256;exeSha256=(Get-FileHash -LiteralPath $exe).Hash.ToLowerInvariant()} | ConvertTo-Json -Compress
            $runtime=Join-Path $root ('runtime-'+$mode)
            [IO.Directory]::CreateDirectory($runtime) | Out-Null
            $report=Join-Path $root ('runtime-report-'+$mode+'.json')
            $runtimeExit=$null
            $observer=Join-Path $root 'exit-observer.mjs'
            $observerSource=@'
          import cp from 'node:child_process';import {syncBuiltinESMExports} from 'node:module';import fs from 'node:fs';import path from 'node:path';
          const a=process.argv,index=a.indexOf('--exe'),wanted=path.resolve(a[index+1]).toLowerCase(),out=path.join(path.dirname(a[a.indexOf('--report')+1]),'child-exit-observer.jsonl'),original=cp.spawn;const mode=path.basename(a[a.indexOf('--report')+1]).replace('runtime-report-','').replace('.json','');
          let events=0;function record(value){try{if(events++<100)fs.appendFileSync(out,JSON.stringify(value)+'\n')}catch{}}
          cp.spawn=function(file,...rest){const child=Reflect.apply(original,this,[file,...rest]);if(path.resolve(String(file)).toLowerCase()===wanted){record({event:'ownedNativeChildSpawn',mode,pid:child.pid});child.once('exit',(code,signal)=>record({event:'ownedNativeChildExit',mode,pid:child.pid,code,signal}));child.once('error',e=>record({event:'ownedNativeChildError',mode,pid:child.pid,code:/^[A-Z0-9_]+$/.test(e.code||'')?e.code:'UNKNOWN'}));}return child;};syncBuiltinESMExports();
          '@
            [IO.File]::WriteAllText($observer,$observerSource,[Text.UTF8Encoding]::new($false))
            $p=[Diagnostics.Process]::new()
            $p.StartInfo=[Diagnostics.ProcessStartInfo]::new($node)
            $p.StartInfo.UseShellExecute=$false;$p.StartInfo.CreateNoWindow=$true
            $p.StartInfo.RedirectStandardOutput=$true;$p.StartInfo.RedirectStandardError=$true
            $p.StartInfo.WorkingDirectory=$source
            foreach ($name in @('GH_TOKEN','NODE_OPTIONS','ELECTRON_RUN_AS_NODE')) { [void]$p.StartInfo.Environment.Remove($name) }
            $arguments=@('--import',([uri]::new($observer)).AbsoluteUri,(Join-Path $source 'scripts/verify-installed-runtime.mjs'),'--app-dir',(Join-Path $install 'resources/app'),'--exe',$exe,'--test-root',$runtime,'--report',$report,'--expected-version','2.39.0','--expected-fingerprint','0ae9f24468d3ce0a756836e54fe5c1ffd44c69f56d747ae0c8f65a4010fb5a22','--hidden-only')
            foreach ($argument in $arguments) { $p.StartInfo.ArgumentList.Add($argument) }
            [DiagnosticManifestProbe]::StartWatch($exe)
            try {
              if (!$p.Start()) { throw 'Original runtime verifier could not start.' }
              $stdout=$p.StandardOutput.ReadToEndAsync();$stderr=$p.StandardError.ReadToEndAsync()
              if (!$p.WaitForExit(360000)) { $p.Kill($true);$forced=$true;throw 'Original runtime verifier exceeded six minutes.' }
              [void]$stdout.Wait(5000);[void]$stderr.Wait(5000)
              $runtimeExit=$p.ExitCode
              if ($stdout.IsCompletedSuccessfully) { [IO.File]::WriteAllText((Join-Path $root 'verifier.stdout'),$stdout.Result) }
              if ($stderr.IsCompletedSuccessfully) { [IO.File]::WriteAllText((Join-Path $root 'verifier.stderr'),$stderr.Result) }
            } finally { $p.Dispose();$elevations=[DiagnosticManifestProbe]::StopWatch();@{event='ownedNativePrivileges';mode=$mode;samples=@($elevations)} | ConvertTo-Json -Compress -Depth 4 }
            if (Test-Path -LiteralPath $report) {
              $value=[IO.File]::ReadAllText($report) | ConvertFrom-Json
              @{event='originalVerifierResult';mode=$mode;diagnosticOnly=$true;installerAcceptance=$false;nativeStatus=$(if($value.passed -eq $true -and $runtimeExit -eq 0){'PASS'}else{'FAIL'});exitCode=$runtimeExit;value=$value} | ConvertTo-Json -Compress -Depth 20
            }
            $trace=Join-Path $root 'child-exit-observer.jsonl'
            if ((Test-Path -LiteralPath $trace) -and (Get-Item -LiteralPath $trace).Length -le 65536) {
              foreach ($line in [IO.File]::ReadAllLines($trace)) { $null=$line | ConvertFrom-Json;Write-Host $line }
            }
            foreach ($log in @(Get-ChildItem -LiteralPath $runtime -Recurse -File | Where-Object {$_.Name -in @('private-native.log','private-errors.log')})) {
              $stream=[IO.File]::OpenRead($log.FullName)
              try { if($stream.Length -gt 262144){[void]$stream.Seek(-262144,[IO.SeekOrigin]::End)};$reader=[IO.BinaryReader]::new($stream);$bytes=$reader.ReadBytes(262144) } finally { $stream.Dispose() }
              $text=[Text.Encoding]::UTF8.GetString($bytes)
              $lines=$text -split '\r?\n';$keep=[Collections.Generic.SortedSet[int]]::new()
              for($i=0;$i -lt $lines.Count;$i++){if($lines[$i] -match '(?i)Error|Exception|ERR_MODULE|Cannot find|BLACKICE.*start|fatal'){foreach($j in ([Math]::Max(0,$i-1))..([Math]::Min($lines.Count-1,$i+2))){[void]$keep.Add($j)}}}
              $excerpt=(($keep | Select-Object -First 80 | ForEach-Object {$lines[$_].Substring(0,[Math]::Min(1000,$lines[$_].Length))}) -join [Environment]::NewLine)
              $excerpt=Redact-Excerpt $excerpt
              if($excerpt.Length -gt 16384){$excerpt=$excerpt.Substring(0,16384)}
              @{event='startupFatalExcerpt';mode=$mode;file=$log.Name;redacted=$true;text=$excerpt} | ConvertTo-Json -Compress -Depth 3
            }
            }
          } finally {
            try{$null=[DiagnosticManifestProbe]::StopWatch()}catch{}
            $prefix=[IO.Path]::GetFullPath($install).TrimEnd('\')+'\'
            foreach($process in @(Get-CimInstance Win32_Process | Where-Object {$_.ExecutablePath -and $_.ExecutablePath.StartsWith($prefix,[StringComparison]::OrdinalIgnoreCase)})){
              $current=Get-CimInstance Win32_Process -Filter ("ProcessId="+$process.ProcessId)
              if($current -and $current.CreationDate -eq $process.CreationDate -and $current.ExecutablePath -ceq $process.ExecutablePath){Stop-Process -Id $current.ProcessId -Force -ErrorAction SilentlyContinue;$forced=$true}
            }
            if($installed){
              $uninstallers=@(Get-ChildItem -LiteralPath $install -File -Filter 'Uninstall*.exe' -ErrorAction SilentlyContinue)
              if($uninstallers.Count -eq 1 -and [IO.Path]::GetDirectoryName($uninstallers[0].FullName) -ieq $install){Wait-OwnedSetup $uninstallers[0].FullName '/S /currentuser'}
            }
            @{event='diagnosticCleanup';diagnosticOnly=$true;forcedTerminationUsed=$forced;installationRemoved=!(Test-Path -LiteralPath $install);releaseEdits=$false;vmActions=$false} | ConvertTo-Json -Compress
            if ([IO.Path]::GetDirectoryName($root) -ine $runner -or [IO.Path]::GetFileName($root) -notmatch '^blackice-startup-diag-[a-f0-9]{32}$') { throw 'Diagnostic cleanup boundary mismatch.' }
            Remove-Item -LiteralPath $root -Recurse -Force
          }
