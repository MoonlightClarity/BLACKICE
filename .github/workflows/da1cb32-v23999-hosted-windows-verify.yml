# BLACKICE v2.39.99 — FOR INDEPENDENT ROOT REVIEW. NOT COMMITTED/DISPATCHED.
# If approved, copy to .github/workflows/da1cb32-v23999-hosted-windows-verify.yml
# with two pinned scripts in .github/blackice-release/ under the SAME reviewed workflow commit.
# NOT a production installation. Genuine fresh disposable GitHub-hosted Windows VM only.
name: BLACKICE 2.39.99 isolated Windows release acceptance (review only)

"on":
  workflow_dispatch:
    inputs:
      expected_workflow_commit:
        description: "Independently reviewed exact workflow Git commit SHA, NOT tested source da1cb32"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: blackice-23999-single-disposable-windows-acceptance
  cancel-in-progress: false

jobs:
  disposable_windows_acceptance:
    name: Exact frozen installer + short sparse-source runtime acceptance
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout only the reviewed workflow and runner scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify genuine GitHub-hosted runner and single workflow admission
        env:
          EXPECTED_WORKFLOW_COMMIT: ${{ inputs.expected_workflow_commit }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
              $env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ARCH -cne 'X64' -or
              $env:GITHUB_SERVER_URL -cne 'https://github.com' -or
              $env:GITHUB_REPOSITORY -cne 'MoonlightClarity/BLACKICE') {
            throw 'Genuine GitHub-hosted Windows x64 runner required.'
          }
          if ($env:EXPECTED_WORKFLOW_COMMIT -cnotmatch '^[a-f0-9]{40}$' -or
              $env:GITHUB_SHA -cne $env:EXPECTED_WORKFLOW_COMMIT) {
            throw 'Reviewed workflow commit differs from actual GITHUB_SHA.'
          }
          if ($env:GITHUB_RUN_ATTEMPT -cne '1') { throw 'No rerun of an uncertain installer effect.' }
          if (!$env:GH_API_TOKEN) { throw 'Missing ephemeral read-only Actions admission token.' }
          $headers = @{
            'Authorization' = ('Bearer ' + $env:GH_API_TOKEN)
            'Accept' = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'BLACKICE-23999-single-run-admission'
          }
          $url = 'https://api.github.com/repos/MoonlightClarity/BLACKICE/actions/workflows/da1cb32-v23999-hosted-windows-verify.yml/runs?event=workflow_dispatch&per_page=100'
          $runs = Invoke-RestMethod -Uri $url -Method Get -Headers $headers -TimeoutSec 25
          if ([int]$runs.total_count -ne 1 -or
              @($runs.workflow_runs).Count -ne 1 -or
              [string]$runs.workflow_runs[0].id -cne $env:GITHUB_RUN_ID) {
            throw 'Existing or ambiguous workflow admission; do not install or replay.'
          }
          Write-Output 'Real hosted Windows runner, exact reviewed workflow SHA and first unique workflow run verified. No installer executed.'

      - name: Configure exact Node.js version for verified read-only asset intake
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          package-manager-cache: false

      - name: Check exact reviewed intake code bytes (no execution)
        env:
          EXPECTED_WORKFLOW_COMMIT: ${{ inputs.expected_workflow_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_SHA -cne $env:EXPECTED_WORKFLOW_COMMIT) { throw 'Reviewed workflow SHA changed.' }
          if ((& node --version).Trim() -cne 'v22.23.5') { throw 'Unexpected Node runtime version.' }
          $folder = Join-Path $env:GITHUB_WORKSPACE '.github\blackice-release'
          $fetch = Join-Path $folder 'da1cb32-v23999-hosted-windows-fetch-draft-assets.REVIEW.mjs'
          $install = Join-Path $folder 'da1cb32-v23999-hosted-windows-intake.REVIEW.ps1'
          if (!(Test-Path -LiteralPath $fetch -PathType Leaf) -or
              !(Test-Path -LiteralPath $install -PathType Leaf)) {
            throw 'Reviewed intake scripts missing from exact workflow commit.'
          }
          if ((Get-FileHash -LiteralPath $fetch -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'c232a25404f60facd96a660c41a0e1434dca18722d4fb73a1b210d5bb2198bf9') {
            throw 'Reviewed original draft-asset fetcher SHA-256 changed.'
          }
          if ((Get-FileHash -LiteralPath $install -Algorithm SHA256).Hash.ToLowerInvariant() -cne '2a921145c242588eddc6d32cd5c7a5edb4a79230d52784b6dd5f9806467bb287') {
            throw 'Reviewed Windows intake PowerShell SHA-256 changed.'
          }
          & node --check $fetch
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed Node downloader syntax invalid.' }
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($install, [ref]$tokens, [ref]$errors)
          if (@($errors).Count -gt 0) { throw 'Reviewed PowerShell intake syntax invalid.' }
          Write-Output 'Both exact reviewed intake scripts pass hash and static parse checks.'

      - name: Read-only fetch exact THREE unpublished draft assets and immutable archiver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_WORKFLOW_COMMIT: ${{ inputs.expected_workflow_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE '.github\blackice-release\da1cb32-v23999-hosted-windows-fetch-draft-assets.REVIEW.mjs'
          $workspace = Join-Path $env:RUNNER_TEMP 'b99'
          & node $script --workspace $workspace
          if ($LASTEXITCODE -ne 0) { throw 'Read-only draft download/hash/terminal-draft gate did not pass. Do not install.' }

      - name: Validate original reconstructed source and disposable NSIS/shortcut/runtime/uninstall
        env:
          EXPECTED_WORKFLOW_COMMIT: ${{ inputs.expected_workflow_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_TOKEN) { throw 'No GitHub API credential may reach installer/native runtime.' }
          $script = Join-Path $env:GITHUB_WORKSPACE '.github\blackice-release\da1cb32-v23999-hosted-windows-intake.REVIEW.ps1'
          & $script
          if ($LASTEXITCODE -ne 0) { throw 'Disposable installed Windows acceptance did not pass.' }

      - name: Preserve bounded disposable receipts as a run artifact (NOT a release)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blackice-23999-disposable-Windows-evidence-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          overwrite: false
          include-hidden-files: false
          path: |
            ${{ runner.temp }}\b99\download-receipt.json
            ${{ runner.temp }}\b99\verification\blackice-intake-preinstall.json
            ${{ runner.temp }}\b99\verification\blackice-intake-terminal.json
            ${{ runner.temp }}\b99\verification\blackice-windows-install-validation.json
            ${{ runner.temp }}\b99\verification\blackice-runtime-validation.json
            ${{ runner.temp }}\b99\verification\blackice-runtime-integrity.json
            ${{ runner.temp }}\b99\verification\blackice-public-readiness.json
            ${{ runner.temp }}\b99\verification\blackice-release-receipts.json
            ${{ runner.temp }}\b99\verification\blackice-source-test-provenance.json
            ${{ runner.temp }}\b99\verification\blackice-external-source-test-provenance.json
