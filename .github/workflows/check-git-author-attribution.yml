name: Commit attribution integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject BLACKICE project impersonation via Git identity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-git-author-attribution.mjs "$BASE_SHA" "$HEAD_SHA"
