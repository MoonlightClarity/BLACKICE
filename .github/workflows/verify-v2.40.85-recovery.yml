name: Verify BLACKICE 2.40.85 source candidate (no publication)

on:
  push:
    branches:
      - recovery/full-lineage-24085-20261127
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blackice-24085-source-${{ github.ref }}
  cancel-in-progress: true # supersede stale recovery-only source validation; publication never runs here

jobs:
  source-qualification:
    if: github.ref == 'refs/heads/recovery/full-lineage-24085-20261127'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.2'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked test dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify documentation links
        run: npm run docs:check
      - name: Exercise mandatory native Chromium stress tests on disposable Windows
        shell: pwsh
        env:
          RELAY_LIVE_BROWSER_QA: '1'
        run: |
          $ErrorActionPreference='Stop'
          $tap=Join-Path $env:RUNNER_TEMP 'blackice-2.40.85-native-browser-stress.tap'
          node --test --test-concurrency=1 --test-reporter=tap tests/browser-engine-stress.integration.test.mjs tests/browser-native-lifecycle-stress.integration.test.mjs tests/browser-stabilization.integration.test.mjs > $tap 2>&1
          $code=$LASTEXITCODE
          Get-Content -LiteralPath $tap -Tail 100
          if ($code -ne 0) { throw 'Mandatory Chromium browser stress validation failed.' }
          $output=Get-Content -LiteralPath $tap -Raw
          if ($output -notmatch '(?m)^# tests 3\s*$' -or $output -notmatch '(?m)^# pass 3\s*$' -or $output -notmatch '(?m)^# fail 0\s*$' -or $output -notmatch '(?m)^# skipped 0\s*$') { throw 'Native browser stress test inventory incomplete.' }
      - name: Run full canonical Windows source suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PLANNING_BEHAVIOR_PYTHON = (Get-Command python).Source
          $evidence = Join-Path $env:RUNNER_TEMP 'blackice-2.40.85-source-evidence'
          node scripts/source-suite-receipt.mjs $evidence
          if ($LASTEXITCODE -ne 0) { throw 'Canonical Windows source suite failed; no release qualification.' }
          $receipt = Get-Content -Raw (Join-Path $evidence 'windows-2.40.85.json') | ConvertFrom-Json
          if ($receipt.passed -ne $true -or $receipt.version -cne '2.40.85' -or $receipt.tests.failed -ne 0 -or $receipt.tests.requiredSkipped -ne 0 -or $receipt.tests.cancelled -ne 0) { throw 'Source qualification receipt failed its binding checks.' }
          Write-Output ('Verified Windows source tests: ' + $receipt.tests.passed + '/' + $receipt.tests.total)
      - name: Preserve source qualification receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackice-2.40.85-source-qualification
          path: |
            ${{ runner.temp }}/blackice-2.40.85-source-evidence/windows-2.40.85.json
            ${{ runner.temp }}/blackice-2.40.85-source-evidence/inventory.json
          if-no-files-found: warn
          retention-days: 7

# This workflow does not build or publish a release, run an installer,
# change the user's computer, or authorize removal of local disk artifacts.