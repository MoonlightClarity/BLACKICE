name: Publish BLACKICE 2.39.26 browser and pairing update

on:
  push:
    branches: [main]
    paths:
      - desktop/browser-driver.mjs
      - .github/workflows/publish-23926-mp4-upload.yml
      - RELEASE-NOTES-2.39.26.md
      - lib/workbench-pairing.mjs
      - lib/windows-workbench.mjs
      - scripts/workbench-guest-reconnect.ps1
      - scripts/workbench-guest-pair-bootstrap.ps1
      - public/next/workspaces/workbench-guide.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blackice-23926-mp4-release
  cancel-in-progress: false

jobs:
  build-and-release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout the exact release source
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'

      - name: Check version and MP4 MIME patch
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          if ($package.version -ne '2.39.26' -or $lock.version -ne '2.39.26') {
            throw 'Version metadata does not match 2.39.26.'
          }
          $driver = Get-Content desktop/browser-driver.mjs -Raw
          if (!$driver.Contains("'.mp4': 'video/mp4'")) { throw 'MP4 browser MIME fix is missing.' }
          if (!(Test-Path RELEASE-NOTES-2.39.26.md)) { throw 'Versioned release notes are missing.' }

      - name: Use native Windows archive tools for native-source packaging
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$env:SystemRoot\System32;$env:PATH"
          "$env:SystemRoot\System32" >> $env:GITHUB_PATH
          $tar = [string]::Join([Environment]::NewLine, @(& "$env:SystemRoot\System32\tar.exe" --version))
          Write-Host $tar
          if ($LASTEXITCODE -ne 0 -or $tar -notmatch 'libzstd/') {
            throw 'The Windows runner needs built-in zstd support in tar.'
          }

      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }

      - name: Verify browser and Workbench pairing regressions
        run: |
          node --test tests/browser-upload-mp4.test.mjs tests/workbench-pairing-auto.test.mjs tests/windows-workbench.test.mjs tests/workbench-agent-tools.test.mjs tests/workbench-console-control.test.mjs tests/windows-release-inputs.test.mjs tests/release-check.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Browser/Workbench regression tests failed.' }

      - name: Build complete Windows Setup.exe
        run: |
          npm run package:public
          if ($LASTEXITCODE -ne 0) { throw 'Public installer build failed.' }

      - name: Package matching native dependency sources
        run: |
          $ErrorActionPreference = 'Stop'
          $sources = Join-Path $PWD '.build/native-source-companion'
          $cache = Join-Path $PWD '.build/native-source-cache'
          node scripts/package-workbench-native-sources.mjs "--output-dir=$sources" "--cache-dir=$cache"
          if ($LASTEXITCODE -ne 0) { throw 'Native corresponding sources could not be packaged.' }
          $dir = Join-Path $PWD 'dist/Blackice-Public-Windows'
          foreach ($name in @('Blackice-2.39.26-Native-Sources.tar','SOURCE-INDEX.json','blackice-native-sources.json')) {
            Copy-Item -LiteralPath (Join-Path $sources $name) -Destination (Join-Path $dir $name) -ErrorAction Stop
          }
          node scripts/release-native-source-assets.mjs "--directory=$dir"
          if ($LASTEXITCODE -ne 0) { throw 'Native source integrity verification failed.' }

      - name: Verify installer bytes and generate checksums
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $PWD 'dist/Blackice-Public-Windows'
          $name = 'Blackice-2.39.26-Setup.exe'
          $installer = Join-Path $dir $name
          $manifestPath = Join-Path $dir 'blackice-public-release.json'
          if (!(Test-Path -LiteralPath $installer) -or !(Test-Path -LiteralPath $manifestPath)) {
            throw 'Public installer or build manifest is missing.'
          }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $installer).Length
          if ($manifest.version -ne '2.39.26' -or $manifest.artifact.name -ne $name -or
              $manifest.artifact.sha256 -cne $hash -or $manifest.artifact.size -ne $size -or
              $size -lt 50000000) {
            throw 'Installer manifest does not match the actual candidate.'
          }
          $names = @($name, 'blackice-public-release.json', 'Blackice-2.39.26-Native-Sources.tar',
                     'SOURCE-INDEX.json', 'blackice-native-sources.json')
          $checksums = @()
          foreach ($item in $names) {
            $h = (Get-FileHash -LiteralPath (Join-Path $dir $item) -Algorithm SHA256).Hash.ToLowerInvariant()
            $checksums += "$h  $item"
          }
          $checksums | Set-Content -LiteralPath (Join-Path $dir 'SHA256SUMS.txt') -Encoding utf8NoBOM
          "RELEASE_DIR=$dir" >> $env:GITHUB_ENV
          "INSTALLER_SHA256=$hash" >> $env:GITHUB_ENV

      - name: Publish versioned GitHub release and installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v2.39.26'
          $existing = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect existing releases.' }
          if (@($existing | Where-Object { $_.tagName -ceq $tag }).Count -gt 0) {
            throw 'This version already has a release; refusing to overwrite.'
          }
          $dir = $env:RELEASE_DIR
          $assets = @(
            (Join-Path $dir 'Blackice-2.39.26-Setup.exe'),
            (Join-Path $dir 'blackice-public-release.json'),
            (Join-Path $dir 'SHA256SUMS.txt'),
            (Join-Path $dir 'Blackice-2.39.26-Native-Sources.tar'),
            (Join-Path $dir 'SOURCE-INDEX.json'),
            (Join-Path $dir 'blackice-native-sources.json')
          )
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'BLACKICE 2.39.26 - MP4 uploads and persistent Workbench pairing' --notes-file 'RELEASE-NOTES-2.39.26.md' --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
          $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json url,targetCommitish,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.targetCommitish -cne $env:GITHUB_SHA) {
            throw 'Published release does not point at this source commit.'
          }
          foreach ($asset in $assets) {
            if (@($release.assets | Where-Object { $_.name -ceq (Split-Path $asset -Leaf) }).Count -ne 1) {
              throw 'Published GitHub release is missing an expected asset.'
            }
          }
          Write-Host "Published $($release.url) with installer SHA-256 $env:INSTALLER_SHA256"
