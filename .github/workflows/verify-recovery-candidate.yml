name: Verify recovery and startup source candidate
on:
  push:
    branches: [codex/recovery-startup-2.39.96, fix/windows-upgrade-detached-helpers-1125]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.2'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: node --test tests/windows-upgrade-preflight.test.mjs
      - run: node scripts/source-suite-receipt.mjs source-suite-evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: source-suite-evidence
          path: source-suite-evidence
          if-no-files-found: error
