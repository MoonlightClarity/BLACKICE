    </linearGradient>
    <radialGradient id="underlight" cx="0" cy="0" r="1" gradientTransform="translate(1800 980) rotate(-145) scale(1120 800)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#416879" stop-opacity=".17"/><stop offset=".62" stop-color="#1c3948" stop-opacity=".06"/><stop offset="1" stop-color="#071018" stop-opacity="0"/>
