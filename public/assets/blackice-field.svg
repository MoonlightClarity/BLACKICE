<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1920" height="1200" viewBox="0 0 1920 1200" fill="none" role="img" aria-labelledby="title description">
  <title id="title">BLACKICE / Quiet fractures</title>
  <desc id="description">An editable vector field of dark translucent ice. Broad overlapping sheets catch a little silver blue light at the edges, with branching fissures kept outside the central reading space.</desc>
